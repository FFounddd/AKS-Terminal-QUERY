<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glasswright Unified Archive System</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Floating Windows -->
    <div id="desktop"></div>

    <!-- Ambient Effects -->
    <div id="noise"></div>
    <div id="scanlines"></div>
    <div id="vignette"></div>

    <!-- Entire Application -->
    <div id="app">

        <!-- ================= Sidebar ================= -->

        <aside id="sidebar">

            <div id="logo">

                <div class="logoSymbol">◈</div>

                <div>

                    <h1>GLASSWRIGHT</h1>
                    <span>Unified Archive System</span>

                </div>

            </div>

            <div class="navTitle">
                MODULES
            </div>

            <button class="module active" data-window="query">
                Query Terminal
            </button>

            <button class="module" data-window="archive">
                Crystal Archive
            </button>

            <button class="module" data-window="personnel">
                Personnel
            </button>

            <button class="module" data-window="research">
                Research
            </button>

            <button class="module" data-window="logs">
                Recovered Logs
            </button>

            <button class="module" data-window="network">
                Crystal Network
            </button>

            <button class="module" data-window="diagnostics">
                Diagnostics
            </button>

        </aside>

        <!-- ================= Main ================= -->

        <main id="main">

            <!-- Top Bar -->

            <header id="topbar">

                <div>

                    <div id="systemName">

                        AKS REMOTE QUERY NODE

                    </div>

                    <div id="build">

                        Build 2.7.18

                    </div>

                </div>

                <div id="systemStatus">

                    <div class="statusItem">

                        Crystal Link

                        <div class="bar">

                            <div
                                class="fill"
                                id="linkBar">
                            </div>

                        </div>

                    </div>

                    <div class="statusItem">

                        <span id="statusText">

                            CONNECTING...

                        </span>

                    </div>

                </div>

            </header>

            <!-- Workspace -->

            <section id="workspace">

                <div id="terminalWindow">

                    <div id="windowHeader">

                        <span>

                            QUERY TERMINAL

                        </span>

                        <div class="windowButtons">

                            <span>—</span>
                            <span>□</span>
                            <span>✕</span>

                        </div>

                    </div>

                    <div id="output"></div>

                    <div id="inputRow">

                        <span class="prompt">

                            QUERY >

                        </span>

                        <input
                            id="command"
                            autocomplete="off"
                            spellcheck="false"
                            autofocus>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <script src="boot.js"></script>
    <script src="terminal.js"></script>
    <script src="ui.js"></script>
    <script src="windows.js"></script>
    <script src="modules.js"></script>
    <script src="personnel.js"></script>

</body>
</html>
